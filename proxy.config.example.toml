# Redirect rules for @hummingbirdworks/proxy.
# https://github.com/ps-Hummingbird/powerapps-mitm-proxy-addon/tree/main#configure

# Single web resource file -> local file.
[[rules]]
type = "single"
web-resource-name = "test_/testfolder/abc.html"
local-path = "./webresources/testfolder/abc.html"

# Folder of web resources -> local folder.
[[rules]]
type = "folder"
web-resource-folder = "test_/testfolder2/"
local-path = "./webresources/testfolder2"

# Folder of web resources -> local Vite dev server, only for a specific host.
[[rules]]
type = "devserver"
web-resource-folder = "test_/my-folder/"
local-url = "http://localhost:5173"
domain = "myorg.crm.dynamics.com"

# PCF control -> local build output folder.
[[rules]]
type = "pcf"
control = "test.BookingsEditor"
local-path = "./bookings-editor/out/controls/BookingsEditor"

# Pull in the rules from another project's config so several projects can proxy
# the same Power Apps environment at once. The included config's relative paths
# resolve against its own location, and it is watched for live reloads too.
[[rules]]
type = "include"
path = "../bookings-editor/proxy.config.toml"
